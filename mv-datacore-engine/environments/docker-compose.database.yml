version: '3'

volumes:
  sqlserver_data:
    driver: local

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    ports:
      - 1433:1433
    volumes:
      - sqlserver_data:/var/opt/mssql
    environment:
      - MSSQL_PID=Express
      - ACCEPT_EULA=Y
      - SA_PASSWORD=laniuslab1!